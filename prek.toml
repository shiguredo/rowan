minimum_prek_version = "0.4.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt-check",
    name = "cargo fmt check",
    language = "system",
    entry = "cargo fmt -- --check",
    pass_filenames = false,
  },
]
