[package]
name = "shiguredo_rowan"
version = "2026.0.0"
edition = "2024"
rust-version = "1.88.0"
description = "Library for generic lossless syntax trees"
repository = "https://github.com/shiguredo/rowan"
license = "Apache-2.0"
autobenches = false
include = ["/LICENSE", "/README.md", "/src/**/*", "/benches/**/*.rs"]

[dependencies]
hashbrown = {
  version = "0.17.1",
  default-features = false,
  features = [
    "inline-more",
    "raw-entry",
  ]
}
rustc-hash = "2.1.2"
text-size = "1.1.1"

[dev-dependencies]
# wall-clock ベンチマーク用の計測基盤
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lib]
path = "src/lib.rs"
bench = false

[[bench]]
name = "green"
harness = false

[[bench]]
name = "cursor"
harness = false

[[bench]]
name = "api"
harness = false
